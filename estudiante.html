<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudiante · AULA DIGITAL RG</title><link rel="stylesheet" href="assets/css/estilos.css"></head>
<body><header class="top"><a class="brand" href="index.html"><span class="brand-icon">🎓</span><div><b>AULA DIGITAL RG</b><small>Espacio del estudiante</small></div></a><button id="logout" class="btn ghost hidden">Salir</button></header><main class="wrap narrow">
<section id="student-auth" class="auth-card"><span class="eyebrow">ACCESO ESTUDIANTE</span><h1>Ingresa a tu aula</h1><div class="tabs"><button class="tab active" data-tab="redeem">Tengo un código</button><button class="tab" data-tab="login">Ya tengo cuenta</button></div>
<form id="redeem-form"><label>Código entregado por tu docente<input id="invite-code" required placeholder="RG-XXXX-XXXX" autocomplete="off"></label><label>Tu nombre completo<input id="student-name" required placeholder="Nombres y apellidos"></label><label>Crea una contraseña<input id="new-password" type="password" required minlength="8" placeholder="Mínimo 8 caracteres"></label><button class="btn primary full">Activar mi acceso</button></form>
<form id="student-login" class="hidden"><label>Código de acceso<input id="login-code" required placeholder="RG-XXXX-XXXX"></label><label>Contraseña<input id="login-password" type="password" required></label><button class="btn primary full">Ingresar</button></form><div id="student-msg" class="message"></div></section>
<section id="student-home" class="hidden"><span class="eyebrow">MI ESPACIO</span><h1>¡Hola, <span id="student-name-display">estudiante</span>!</h1><div class="panel"><h2 id="student-class">Tu aula</h2><p class="muted">Cuando tu docente inicie una clase, aparecerá aquí.</p><div id="student-live-status" class="message">Esperando que el docente inicie la clase...</div><a id="join-live" class="btn primary hidden" href="clase.html">Entrar a la clase sincronizada</a></div></section>
</main><script type="module" src="assets/js/estudiante.js"></script></body></html>
